name: PR build check
# Kein Test-Deploy mehr: getestet wird lokal. Der Workflow prüft nur noch,
# dass der Build (tsc + vite) durchläuft.
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
